<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vermillion Shorts — Master Script Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: #131722; border: 1px solid #232a3b; transition: all 0.2s ease; }
        .card:hover { border-color: #3b82f6; }
        .card-completed { opacity: 0.55; filter: grayscale(0.4); border-color: #10b981 !important; }
        .tag-a { background: #1e3a8a; color: #93c5fd; }
        .tag-b { background: #14532d; color: #86efac; }
        .tag-c { background: #701a75; color: #f0abfc; }
        .tag-d { background: #7c2d12; color: #fdba74; }
        .tag-f { background: #312e81; color: #c7d2fe; }
        .tag-g { background: #365314; color: #bef264; }
        .tag-h { background: #831843; color: #f472b6; }
        .tag-i { background: #134e4a; color: #99f6e4; }
        .tag-j { background: #4c1d95; color: #ddd6fe; }
        .tag-l { background: #3f6212; color: #d9f99d; }
    </style>
</head>
<body class="p-6 max-w-[1800px] mx-auto">
    <!-- Header Controls -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-gray-800 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-bold text-white tracking-wide">VERMILLION SHORTS — CONTENT DASHBOARD</h1>
                <span id="counterBadge" class="bg-blue-900/50 text-blue-400 border border-blue-700/50 text-xs px-2.5 py-0.5 rounded-full font-semibold">35 CLIPS ACTIVE</span>
            </div>
            <p class="text-sm text-gray-400 mt-1">Live tracking, fast editing, teleprompter mode, and status completion</p>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <!-- Search -->
            <input type="text" id="searchInput" onkeyup="filterScripts()" placeholder="Search scripts..." class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-4 py-2 text-white w-52 focus:outline-none focus:border-blue-500">
            
            <!-- Category Filter -->
            <select id="categoryFilter" onchange="filterScripts()" class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <option value="all">All Categories (A–L)</option>
                <option value="A">Cat A: Personal Journey</option>
                <option value="B">Cat B: Steam & Publishing</option>
                <option value="C">Cat C: Team & HR</option>
                <option value="D">Cat D: Design Philosophy</option>
                <option value="F">Cat F: Engine & Tech</option>
                <option value="G">Cat G: Money & Runway</option>
                <option value="H">Cat H: News & Industry</option>
                <option value="I">Cat I: Career & Education</option>
                <option value="J">Cat J: Mindset</option>
                <option value="L">Cat L: Events & Business</option>
            </select>

            <!-- Completion Status Filter -->
            <select id="statusFilter" onchange="filterScripts()" class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <option value="all">All Progress</option>
                <option value="pending">⏳ Pending Recording</option>
                <option value="completed">✅ Recorded / Done</option>
            </select>

            <!-- Sorting Options -->
            <select id="sortOrder" onchange="sortScripts()" class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <option value="clip-asc">Sort: Clip 1 ➔ 35</option>
                <option value="clip-desc">Sort: Clip 35 ➔ 1</option>
                <option value="words-desc">Sort: Longest Word Count</option>
                <option value="words-asc">Sort: Shortest Word Count</option>
            </select>
        </div>
    </header>

    <!-- Script Cards Grid -->
    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="scriptGrid">
        <!-- Cards generated dynamically via JavaScript -->
    </main>

    <!-- Modal: Quick Teleprompter / Direct Editor -->
    <div id="editorModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-3xl w-full p-6 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h2 id="modalTitle" class="text-lg font-bold text-white">Edit Script</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold">✕ Close</button>
            </div>
            <textarea id="modalTextarea" class="w-full h-80 bg-gray-950 border border-gray-800 rounded-xl p-4 text-white font-mono text-base leading-relaxed focus:outline-none focus:border-blue-500" placeholder="Edit script content..."></textarea>
            <div class="flex items-center justify-between text-xs text-gray-400">
                <span id="modalWordCounter">Word count: 0 words (~0s)</span>
                <div class="flex gap-2">
                    <button onclick="copyModalText()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition">📋 Copy Text</button>
                    <button onclick="saveModalChanges()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold transition">💾 Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Master initial script data
        const initialScripts = [
            { id: 1, cat: "A", catName: "Personal Journey", title: "Clip 01 — อยากทำเกม แต่ไม่รู้จะเริ่มยังไง", body: "อยากทำเกมแต่ไม่รู้อะไรเลย วิธีเริ่มที่ง่ายที่สุด คือเปิดยูทูปแล้วทำตามคลิปสอนยาวๆ ให้จบสักคลิปครับ\n\nตอนผมเริ่มฝึกทำเกม ผมก็ใช้วิธีนี้เลย พิมพ์ใน YouTube ไปเลยว่า Making ตามด้วยแนวเกมที่อยากทำ ต่อด้วยคำว่า game tutorial เช่น Making FPS game tutorial Unreal\n\nเลือกคลิปที่ยาวเกินหนึ่งชั่วโมง แล้วเปิดทำตามไปเรื่อยๆ คุณจะได้เกมแรกของตัวเองทันที\n\nจากนั้นค่อยลองซนดูครับ ลองแก้ตัวเลข ลองย้ายของ ลองใช้ asset ฟรี พังก็ไม่เป็นไรครับ ตรงนั้นแหละคือจุดที่เราได้เรียนรู้จริงๆ ว่ากดอะไรตรงไหนแล้วเกิดผลยังไง\n\nทำถึงตรงนี้เมื่อไหร่ ยินดีด้วยครับ คุณกลายเป็นนักพัฒนาเกมแล้ว", completed: false },
            { id: 2, cat: "L", catName: "Events", title: "Clip 02 — ทำไมผมกลับไปออกบูธ Taipei Game Show ถึงสามปี", body: "Taipei Game Show คือเทศกาลเกมไต้หวันที่น่าไปออกบูธมาก และค่าใช้จ่ายถูกจนแทบไม่ต่างจากงานใหญ่ในไทยเลยครับ\n\nผมบินไปออกงานนี้ซ้ำถึงสามปีติด เพราะเหตุผลแรก ผู้จัดวางโซนอินดี้ไว้ใกล้ทางเดินหลัก คนผ่านเยอะ แถมเกมเมอร์ไต้หวันเปิดใจลองเล่นจริง ให้ feedback เต็มที่ ฟังไม่ออกก็จ้างล่ามรายวันได้\n\nเหตุผลที่สอง ค่าบูธหมื่นห้า ตั๋วเครื่องบินพร้อมที่พักสองคนราวๆ สองหมื่น คุ้มค่ามากครับ\n\nเหตุผลที่สาม Publisher เจ้าใหญ่ๆ มากันเยอะ แต่นัดคุยง่าย ไม่ต้องไปแย่งใครเหมือนงานฝั่งยุโรป\n\nงานจัดปลายมกราคมครับ แต่รอบสมัครจะปิดช่วงตุลาคมนี้แล้ว ใครมีเกมพร้อมโชว์ อย่ารอนาทีสุดท้ายครับ", completed: false },
            { id: 3, cat: "D", catName: "Design Philosophy", title: "Clip 03 — คำถามข้อเดียว ก่อนเริ่มทำเกม", body: "ก่อนเริ่มทำเกม คุณต้องตอบให้ได้ก่อนว่า อะไรคือความสนุกหนึ่งเดียวที่จะทำให้คนเล่นอยากกลับมาเล่นซ้ำ\n\nทีมผมใช้คำถามนี้เช็คทุกไอเดียก่อนเริ่มจริงครับ พอมีไอเดียเยอะ ทุกอย่างต้องหยุดรอจนกว่าจะตอบข้อนี้ได้\n\nอย่างเกม mech ของทีม คำตอบคือการแต่งหุ่นให้เป็นของเราเองทุกชิ้นส่วน พอได้คำตอบ ระบบที่เหลือทั้งหมดก็สร้างมาเพื่อเสิร์ฟความสนุกตัวนี้ อะไรที่ไม่ช่วยเสิร์ฟ ตัดทิ้งได้เลยไม่ต้องเสียดาย\n\nผลคือ scope ไม่บาน ทีมไม่หลงทาง เวลาอธิบายเกมให้ใครฟังก็จบในประโยคเดียว\n\nถ้ายังตอบไม่ได้ แปลว่าเรามีแค่ไอเดียแต่ยังไม่มีเกม หาคำตอบให้เจอก่อน แล้วค่อยลงมือครับ", completed: false },
            { id: 4, cat: "G", catName: "Money / Budget", title: "Clip 04 — ทำเกมขายบน Steam ด้วยโปรแกรมฟรี ทำได้จริง", body: "คุณสามารถทำเกมด้วยโปรแกรมฟรีเกือบทั้งหมด แล้วเอาขึ้นไปขายบน Steam ได้จริง โดยไม่ต้องเสียเงินซื้อซอฟต์แวร์แพงๆ\n\nเกมของผมก็ทำแบบนั้นครับ โมเดลสามมิติใช้ Blender เอกสารในทีมใช้ชุดออฟฟิศฟรี ส่วน engine หลักๆ ทุกวันนี้ใช้ฟรีจนกว่าจะมีรายได้ แล้วระบบไหนที่ต้องซื้อแพงๆ เราเขียนเองซะเลย อย่างระบบสุ่มด่าน ทีมเราก็เขียนกันเอง\n\nหลักคิดมีข้อเดียวครับ ก่อนจ่ายเงิน ให้ถามก่อนว่ามีของฟรีที่ทำได้สักเจ็ดสิบแปดสิบเปอร์เซ็นต์มั้ย ถ้ามี ใช้ของฟรีก่อน เก็บเงินไว้จ่ายเงินเดือนคนดีกว่าครับ เพราะคนน่ะหาแทนยาก โปรแกรมน่ะเปลี่ยนเมื่อไหร่ก็ได้", completed: false },
            { id: 5, cat: "L", catName: "Events", title: "Clip 05 — งานธุรกิจเกมระดับโลกมาถึงกรุงเทพแล้ว แถมเข้าฟรี", body: "gamescom asia งานธุรกิจเกมระดับโลกกำลังจะมาจัดที่กรุงเทพปลายเดือนตุลาคมนี้ และเปิดให้คนสายเกมลงทะเบียนเข้าฟรีครับ\n\nงานจัดร่วมกับ Thailand Game Show ที่ศูนย์สิริกิติ์ แต่โซนที่อยากให้นักพัฒนาสนใจที่สุดคือโซน Business สองวันแรกเป็นวัน B2B รวม Publisher นักลงทุน และสตูดิโอต่างชาติมาไว้ในฮอลล์เดียว ถ้าทำงานสายเกมอยู่แล้ว ลงทะเบียน business visitor ล่วงหน้าเข้าฟรีได้เลย ไปสมัครหน้างานเสียเงินครับ\n\nไม่ต้องมีบูธ ไม่ต้องมีนัดก็เดินได้ ไปดูว่าเขาคุยธุรกิจและซื้อขายเกมกันยังไง วงการนี้เล็กกว่าที่คิด เพื่อนร่วมวงการหลายคนผมก็เจอครั้งแรกในงานแบบนี้แหละครับ", completed: false },
            { id: 6, cat: "D", catName: "Design Philosophy", title: "Clip 06 — คอมเมนต์เดียวที่เปลี่ยนวิธีออกแบบเกมของทีมผม", body: "คอมเมนต์เดียวจากผู้เล่นที่บอกว่า \"เกมนี้ซับซ้อนเกินกว่าจะเรียนรู้\" เปลี่ยนวิธีออกแบบเกมของผมไปตลอดกาล\n\nตอนทำ MMORPG เกมแรก ทีมผมงงมาก เพราะพวกเราอยู่กับเกมทุกวันจนเห็นว่าทุกอย่างมันง่าย แต่นั่นแหละครับคือกับดัก ของที่เราว่าง่าย สำหรับคนเปิดเกมครั้งแรกมันคือเขาวงกตดีๆ นี่เอง\n\nบทเรียนคือ ผู้เล่นต้องถูกสอนทุกอย่าง อย่าเชื่อความรู้สึกตัวเอง ให้เอาเกมไปให้คนที่ไม่เคยเห็นลองเล่น แล้วนั่งดูเงียบๆ ว่าเขาติดตรงไหน สิบนาทีแรกบอกความจริงทั้งหมด\n\nคุณจะทำเกมง่ายเพื่อทุกคน หรือซับซ้อนเพื่อสายฮาร์ดคอร์ เลือกได้ทั้งคู่ครับ แค่ขอให้เลือกแบบรู้ตัว", completed: false },
            { id: 7, cat: "G", catName: "Money / Runway", title: "Clip 07 — วิธีคิดง่ายๆ ว่าสตูดิโอจะรอดอีกกี่เดือน", body: "สตูดิโอเกมของเราจะรอดได้อีกกี่เดือน คำนวณแบบง่ายๆได้ด้วยการเอาเงินเก็บที่มีมาหารกับรายได้ในเดือนที่แย่ที่สุด\n\nนี่คือสูตรที่ทีมผมใช้จริงครับ เริ่มจากลิสต์ค่าเช่า เงินเดือน ค่าน้ำค่าไฟ ทุกบาทที่ต้องจ่ายแน่ๆ แล้วบวกค่าใช้จ่ายเผื่อไว้อีกสิบห้าเปอร์เซ็นต์ครับ เผื่อคอมพัง เผื่อคนป่วย เผื่ออะไรไม่คาดคิด\n\nแล้วจากนั้น เอาตัวเลขเดือนที่แย่ที่สุดที่เคยเจอ ให้คิดแบบเลวร้ายที่สุด มาลองหักออกไป จะได้ประเมินได้ว่าทุกเดือน เรามีโอกาสเสียเงินไปเท่าไหร่\n\nแล้วพอเอาเงินเก็บมาหาร ตัวเลขที่ออกมาคือจำนวนเดือนที่อยู่ได้จริง พอรู้เลขนี้ จะรับงานเสริมมั้ย จะขยายทีมมั้ย ตัดสินใจง่ายขึ้นเยอะเลยครับ", completed: false },
            { id: 8, cat: "F", catName: "Engine & Tech", title: "Clip 08 — ทำไมผมเทสต์เกมบนโน้ตบุ๊คอายุสิบปี", body: "เกมของผมบน Steam ถูกเทสต์บนโน้ตบุ๊คอายุสิบปี การ์ดจอ 1050 เพราะถ้ามันรันบนเครื่องนี้ได้ลื่น มันจะรันได้ลื่นบนเครื่องของผู้เล่นทุกคน\n\nบทเรียนนี้ได้มาจากยุคทำเกมมือถือครับ เครื่องผู้เล่นไม่ได้มีแค่เกมเรา แต่มีโปรแกรมอื่นกินทรัพยากรอยู่เบื้องหลังไปครึ่งเครื่องแล้ว เกมมือถือเกมคอม ยังไงทรัพยากรเขาไม่ได้ให้เราทั้งหมด\n\nทีมเลยตั้งกฎเหล็กเลยว่า ต้องเทสต์บนเครื่องที่สเปคต่ำสุดเท่าที่จะหาได้\n\nผมชอบเทสต์บนเครื่องนี้มากนะครับ ลุ้นทุกครั้งว่าจะไหวมั้ย เจ้าเครื่องนี้รับใช้ทีมมาหลายปีและยังเป็นที่ใช้งานอยู่เรื่อยๆ\n\nเครื่องเก่าที่บ้านอย่าเพิ่งขายทิ้งครับ มันคือเครื่องเทสต์ที่ซื่อสัตย์ที่สุดสำหรับคนทำเกม", completed: false },
            { id: 9, cat: "B", catName: "Steam & Publishing", title: "Clip 09 — 5 คำถามที่ Publisher ถามจริง", body: "นี่คือ 5 คำถามจริงที่คุณต้องเจอเวลาได้นัดคุยกับ Publisher\n\n1. ตั้งราคาเกมไว้เท่าไหร่ ทำไมถึงราคานี้ /\n2. ต้องใช้เงินอีกเท่าไหร่เกมถึงเสร็จ แล้วถ้าเราไม่ช่วย คุณอยู่ได้อีกนานแค่ไหน /\n3. ถ้าลงทุนให้ แต่ไม่ได้ market ให้ คุณจะหา wishlist จากไหน /\n4. เกมคล้ายๆ กันมีเต็มตลาด ทำไมของคุณถึงจะขายได้ /\n5. คุณศึกษาบริษัทเรามาดีแค่ไหน\n\nเวลาไปคุยกับ Publisher สิ่งที่เขาถามไม่ใช่เรื่องของเกมคุณ แต่เขาดูว่าทำธุรกิจด้วยแล้วรอดมั้ย\n\nจากที่ผมเคยนั่งคุยมาหลายสิบนัด หน้าตาเกมคือใบเบิกทางให้ได้เข้าห้องครับ แต่พอนั่งลงแล้ว มันคือเรื่องธุรกิจล้วนๆ เตรียมคำตอบไปให้พร้อมครับ", completed: false },
            { id: 10, cat: "I", catName: "Career & Education", title: "Clip 10 — ทำไมวัยเรียนคือช่วงที่ดีที่สุดในการเริ่มทำเกม", body: "ตอนยังเรียนอยู่คือช่วงเวลาที่ดีที่สุดในการเริ่มทำเกมแรก เพราะนั่นคือช่วงเดียวในชีวิตที่คุณ \"ล้มแล้วเจ็บน้อยที่สุด\" ลองนับภาระตอนเรียนดูครับ ยังไม่มีลูก ยังไม่มีผ่อนบ้านผ่อนรถ ครอบครัวยังช่วยซัพพอร์ตให้ได้\n\nถ้าเกมแรกไม่รอด สิ่งที่เสียไปคือเวลาและเงินเก็บก้อนนึง แล้วชีวิตก็เดินต่อได้\n\nแต่พอโตขึ้น มีภาระมากมาย จะแบ่งเวลามาลองทำเกมสักปี ต้องคิดหนักกว่าเดิมหลายสิบเท่า\n\nล้มทีนึงเจ็บกว่าเยอะครับ\n\nผมเองเริ่มตอนอายุยังไม่ถึงยี่สิบ เจ๊งมาแล้วรอบสองรอบ ที่ลุกได้ไวเพราะยังไม่มีภาระเท่าไหร่\n\nไม่ได้ชวนให้ทิ้งการเรียนนะครับ เรียนไปด้วยทำไปด้วยได้ แค่อย่ารอให้พร้อม เพราะวันที่พร้อมที่สุด อาจเป็นวันนี้แล้วครับ", completed: false },
            { id: 11, cat: "H", catName: "News / AI", title: "Clip 11 — เมื่อคนทำเกมกลัว AI เลียนแบบจนต้องยกเลิก Demo", body: "ทีมพัฒนาเกม Drunken Goddess Reflux ประกาศยกเลิก Public Demo บน Steam เพราะกลัวว่า AI ยุคนี้จะถูกนำมาใช้ก๊อปปี้ทุกอย่างในเกมแล้วชิงตัดหน้าวางขายก่อน\n\nเดิมทีเกมมีแผนเปิดเดโมฟรี แต่ทีมงานยอมรับว่ากลัวมาก เพราะเครื่องมือ AI และ Vibe-coding ตอนนี้ไม่ได้ก๊อปแค่ Asset ภาพ แต่ลามไปถึงแนวเกม ระบบเกม สูตรคำนวน ทั้งหมด ซึ่งเอาไปสร้างตัวเลียนแบบได้ในเวลาไม่กี่วัน\n\nทำให้พวกเขาต้องเปลี่ยนแผนไปเปิดทดสอบแบบระบบปิดที่ต้องลงทะเบียนและเซ็นสัญญาแทน\n\nในมุมคนทำเกม มันสะท้อนเลยว่าความเสี่ยงเรื่องโดนก๊อปปี้ด้วย AI มันชิดติดหน้าประตูบ้านเราจริงๆ วงการเรากำลังเข้าสู่ยุคที่ต้องระวังตัวกันมากขึ้นเยอะเลยครับ", completed: false },
            { id: 12, cat: "L", catName: "Events & Business", title: "Clip 12 — โอกาสธุรกิจเกม B2B ที่ Gamescom Asia x Thailand Game Show", body: "29 ตุลาคม ถึง 1 พฤศจิกายนนี้ งาน gamescom asia x Thailand Game Show ที่ศูนย์สิริกิติ์ คือโอกาสทองของนักพัฒนาเกมไทย ในการเจรจาธุรกิจกับ Publisher ระดับโลก\n\nโดยเฉพาะวันที่ 29 ถึง 30 ตุลาคม ซึ่งเป็นโซน B2B จากประสบการณ์ที่ผมเคยเดินงานและนัดเจอ Dev ต่างชาติ การคุยธุรกิจมันไม่ได้ยากอย่างที่คิดครับ\n\nยิ่งปีนี้สมาคม GIVA จับมือกับ MeetToMatch จัดพื้นที่ GIVA Business Lounge ให้คนทำเกมไทยเข้ามานั่งคุยจับคู่ธุรกิจได้สะดวกมาก\n\nคุณไม่ต้องมีบูธใหญ่ ไม่ต้องเสียเงินบินไปต่างประเทศ แค่สมัครบัตร Business Visitor หรือใช้ระบบ MeetToMatch นัดเวลา แล้วเดินเข้าไป Pitch งานแลกเปลี่ยนความเห็นได้เลย\n\nโอกาสเจอนักลงทุนอยู่อยู่หน้าบ้านเราแล้ว ไปลงทะเบียนกันไว้ก่อนเลยครับ", completed: false },
            { id: 13, cat: "A", catName: "Personal Journey", title: "Clip 13 — เรียน 7 ปีเพราะทำงานไปด้วย", body: "ผมใช้เวลาเรียนมหาลัยถึง 7 ปีเต็มกว่าจะจบ ไม่ใช่เพราะเรียนไม่เก่ง แต่เพราะผมเลือกทำงานหาเงินควบคู่ไปด้วยตลอด\n\nตอนนั้นผมลงเรียนแค่อาทิตย์ละสองวัน ส่วนเวลาที่เหลือคือการทำงานหาเงินมาเลี้ยงตัวเองและเก็บเป็นทุนทำเกม\n\nช่วงนั้นเหนื่อยมากครับ แต่บทเรียนที่ได้กลับมาคุ้มค่าสุดๆ มันทำให้ผมเข้าใจเรื่องการบริหารเวลา รู้จักคุณค่าของเงิน และเรียนรู้ระบบธุรกิจจริงตั้งแต่ยังเรียนไม่จบ\n\nการเรียนจบช้ากว่าเพื่อนไม่ใช่เรื่องน่าอายเลยครับ ถ้าเวลาที่เสียไป เราเอาไปแลกกับประสบการณ์และทักษะชีวิตที่หาไม่ได้ในห้องเรียน\n\nอย่าเอาบรรทัดฐานคนอื่นมาวัดความสำเร็จของเราครับ เดินในจังหวะของตัวเองดีที่สุด", completed: false },
            { id: 14, cat: "C", catName: "Team & HR", title: "Clip 14 — จาก 18 เหลือ 7 คน วงจรการลดขนาดทีม", body: "การลดขนาดทีมจากสิบแปดคนเหลือเจ็ดคน ไม่ใช่เรื่องล้มเหลว แต่เป็นการคัดคนเพื่อให้บริษัทรอด\n\nช่วงเริ่มตั้งสตูดิโอใหม่ๆ เรามีคนเยอะมาก แต่พอเงินทุนเริ่มลดลง และเป้าหมายไม่ตรงกัน คนก็ค่อยๆ แยกย้ายไปตามทาง\n\nมีทั้งคนที่ลาออกเอง คนที่ต้องเชิญออก และคนที่รับความเสี่ยงร่วมกันไม่ไหว\n\nบทเรียนที่ได้คือ ทีมขนาดเจ็ดคนที่มีเป้าหมายเดียวกัน และพร้อมสู้ไปด้วยกัน ทำงานได้เร็วกว่าทีมสิบแปดคนที่เดินกันคนละทิศคนละทาง\n\nยิ่งทีมเล็ก การสื่อสารยิ่งชัด ความคล่องตัวยิ่งสูง บริษัทไม่ได้วัดความสำเร็จที่จำนวนคน แต่ดูที่งานที่ปล่อยออกมาครับ", completed: false },
            { id: 15, cat: "A", catName: "Personal Journey", title: "Clip 15 — วันที่แย่ที่สุดในการเป็น Founder", body: "วันที่แย่ที่สุดในชีวิตการเป็น Founder ของผม ไม่ใช่โดนผู้เล่นด่า แต่คือวันที่ต้องไปนั่งรอลูกค้าในห้างคนเดียว\n\nช่วงที่ต้องหาเงินมาจ่ายเงินเดือนทีม ผมต้องรับหน้าที่เป็นเซลล์ออกไปเสนอขายงาน วันไหนที่นัดลูกค้าไม่ได้เลย ผมจะไปนั่งอยู่ในห้าง มองกาแฟเย็นชืด แล้วถามตัวเองว่าทำอะไรอยู่\n\nตอนนั้นผมเขียนโค้ดไม่เก่ง วาดรูปไม่ได้ สิ่งเดียวที่ทำได้ดีที่สุดคือออกไปหาเงิน เพื่อให้คนที่เก่งกว่าผม ไม่ต้องหยุดทำเกม\n\nวันนั้นสอนให้ผมรู้ว่า หน้าที่ของผู้นำไม่ใช่การโชว์อีโก้ แต่คือการทำทุกอย่างให้ทีมมีกินและได้ทำสิ่งที่รักต่อไปครับ", completed: false },
            { id: 16, cat: "G", catName: "Money & Survival", title: "Clip 16 — บทเรียนจากเงินล้านแรกที่ทำหายไป", body: "เงินล้านแรกที่ผมยืมญาติมาทำธุรกิจเกมล้มเหลวไม่เป็นท่า แต่มันคือวิชาบริหารธุรกิจที่คุ้มค่าที่สุดในชีวิต\n\nตอนอายุยี่สิบ ผมได้โอกาสทำบริษัทเกมครั้งแรกด้วยเงินกู้จากผู้ใหญ่ แต่เพราะความอ่อนหละหลวมและไม่มีประสบการณ์ เงินก้อนนั้นละลายหายไปในเวลาไม่นาน\n\nสิ่งที่ผู้ใหญ่สอนผมหลังจากนั้นคือ ทำธุรกิจอย่าใช้แต่ Passion ให้มองเรื่อง Cashflow และสัญญาเป็นหลัก\n\nข้อดีของการล้มเหลวตั้งแต่ยังเด็กคือ เรายังมีเวลาลุกขึ้นใหม่ และบทเรียนนั้นทำให้ผมระวังเรื่องเงินทุกบาทใน M.A.S.S. Builder มาจนถึงทุกวันนี้\n\nล้มได้ครับ แค่ต้องจำให้ได้ว่าล้มเพราะอะไร", completed: false },
            { id: 17, cat: "A", catName: "Personal Journey", title: "Clip 17 — จากจุดเริ่มต้นแอปพ่นสี สู่ M.A.S.S. Builder", body: "เกม M.A.S.S. Builder ที่ขายบน Steam ในวันนี้ ไม่ได้เริ่มจากการคิดจะทำเกม แต่เริ่มจากแอปทดลองพ่นสีโมเดลพลาสติก\n\nทีมผมเป็นพวกชอบต่อ Gunpla มาก เราเลยอยากทำซอฟต์แวร์จำลองการทำสีโมเดลไว้ดูเป็นตัวอย่างก่อนพ่นจริง\n\nทำไปทำมา พวกเราก็คิดกันว่า ถ้าเอาหุ่นพวกนี้มาขยับได้ ใส่ vũกิษ ได้ และบินยิงกันได้ มันน่าจะสนุกกว่าแค่พ่นสีแน่ๆ\n\nนั่นคือจุดเปลี่ยนที่ทำให้แอปเล็กๆ กลายมาเป็นโปรเจกต์ใหญ่ที่ใช้เวลาทำหลายปี\n\nบางทีไอเดียทำเกมที่ดีที่สุด อาจไม่ได้มาจากหน้ากระดาษว่างๆ แต่มาจาก Passion เล็กๆ ในชีวิตประจำวันของเราครับ", completed: false },
            { id: 18, cat: "J", catName: "Mindset", title: "Clip 18 — ความรู้สึก Impostor Syndrome ของคนทำเกม", body: "ต่อให้คุณทำเกมมาห้าปี คุณก็ยังรู้สึกว่าตัวเองไม่ใช่ Dev ตัวจริง จนกว่าวันที่เกมจะได้ Ship ขายบน Steam\n\nสภาพจิตใจที่เรียกว่า Impostor Syndrome หรือการรู้สึกว่าตัวเองไม่เก่งจริง มันเกิดขึ้นกับคนทำเกมทุกคนครับ\n\nตอนทำเกม เราจะคอยตั้งคำถามตลอดเวลาว่า งานเราดีพอรึยัง คนเล่นจะชอบมั้ย หรือเรากำลังหลอกตัวเองอยู่\n\nความรู้สึกนี้จะหายไปก็ต่อเมื่อเกมถูกปล่อยออกไปสู่โลกจริง มีผู้เล่นซื้อไปเล่น และส่ง Feedback กลับมา\n\nถ้าคุณกำลังรู้สึกแบบนี้อยู่ ไม่ต้องตกใจครับ คุณไม่ได้เป็นคนเดียว ทำงานต่อไป ส่งเกมออกไป แล้วให้ผลงานเป็นตัวตอบครับ", completed: false },
            { id: 19, cat: "C", catName: "Team & HR", title: "Clip 19 — ทำไมสตูดิโอเราถึงเลิกรับงาน Outsource 100%", body: "การตัดท่อน้ำเลี้ยงจากงาน Outsource แล้วทุ่มทำเกมตัวเองร้อยเปอร์เซ็นต์ คือการตัดสินใจที่เสี่ยงที่สุด แต่นั่นทำให้ M.A.S.S. Builder เสร็จได้จริง\n\nช่วงแรกเราใช้วิธีรับงานนอกมาเลี้ยงทีม แต่งานนอกมักจะดูดเวลาและพลังงานไปจนหมด จนไม่มีแรงเหลือมาทำเกมตัวเอง\n\nสุดท้ายเราเลยประชุมกัน แล้วตัดสินใจตัดงาน Outsource ทิ้งทั้งหมด เพื่อเอาเวลามาดันเกมหลักให้เสร็จ\n\nมันทำให้เงินสตูดิโอตึงมาก แต่ผลลัพธ์คือทีมมี Focus เดียว งานเดินเร็วขึ้นสิบเท่า\n\nถ้าคุณอยากทำเกมตัวเองให้เสร็จจริงๆ วันนึงคุณต้องกล้าละทิ้งงานนอก แล้วทุ่มสุดตัวครับ", completed: false },
            { id: 20, cat: "D", catName: "Design Philosophy", title: "Clip 20 — ฝันอยากทำ MMORPG vs ความจริงที่ได้ทำ", body: "เด็กทำเกมทุกคนฝันอยากทำ MMORPG แต่ความจริงจะตบหน้าคุณด้วยเรื่อง Cost และการดูแล Server ที่ไม่มีวันจบสิ้น\n\nเกมแรกของทีมผมเริ่มด้วยความฝันอยากทำ MMORPG ครับ เราใส่ทุกระบบที่อยากได้ลงไป ผลคือเหนื่อยมาก และเจอปัญหารอบด้าน\n\nการทำเกมออนไลน์ไม่ได้จบแค่สร้างเกมเสร็จ แต่ต้องรับมือกับความเสี่ยงเรื่อง Server บั๊กสำรองข้อมูล และการบาลานซ์เกมสดๆ ตลอดเวลา\n\nบทเรียนนี้ทำให้เราเปลี่ยนมาทำเกม Single-player และ Co-op ใน M.A.S.S. Builder แทน\n\nฝันใหญ่ได้ครับ แต่ต้องเลือกขอบเขตงานให้เหมาะกับกำลังทีม เพื่อให้เราทำจบได้จริงๆ", completed: false },
            { id: 21, cat: "B", catName: "Steam & Publishing", title: "Clip 21 — ขายเกมได้ 1,000 บาท บน Steam เหลือเข้ากระเป๋าจริงเท่าไหร่", body: "ขายเกมได้ 1,000 บาทบน Steam เงินไม่ได้เข้าบัญชีสตูดิโอเต็มจำนวน แต่จะเหลือจริงๆ แค่ประมาณ 50 ถึง 65 เปอร์เซ็นต์เท่านั้น\n\nตัวเลขหายไปไหนบ้าง? หักอย่างแรกคือหักส่วนแบ่ง Platform ของ Steam 30 เปอร์เซ็นต์\n\nหักอย่างที่สอง คือเรื่องภาษี ณ ที่จ่าย และภาษีระหว่างประเทศ ซึ่งขึ้นอยู่กับว่าผู้เล่นซื้อจากประเทศไหน และสตูดิโอทำเอกสารภาษีไว้อย้อนหลังยังไง\n\nหักอย่างที่สาม คือค่าธรรมเนียมการโอนเงินและอัตราแลกเปลี่ยน\n\nเพราะฉะนั้นเวลาทำแผนการเงิน อย่าคำนวณจาก Gross Revenue ครับ ให้คิดจาก Net ในช่วง 50 ถึง 65 เปอร์เซ็นต์ไว้ก่อน จะได้ไม่คำนวณพลาด", completed: false },
            { id: 22, cat: "B", catName: "Steam & Publishing", title: "Clip 22 — 3 ข้อต้องเช็ก ก่อนเซ็นสัญญา Publisher", body: "อย่าเพิ่งรีบเซ็นสัญญา Publisher ถ้ายังไม่ได้เช็ก 3 ข้อนี้ให้ชัวร์ จะได้ไม่เสียใจทีหลัง\n\nข้อแรก เช็กเงื่อนไข Recoupment ให้ดีว่า Publisher จะหักเงินคืนจากยอดขายแรกยังไง หักกี่เปอร์เซ็นต์ และเราจะเริ่มได้ส่วนแบ่งเมื่อไหร่\n\nข้อสอง สิทธิ์ใน IP เกมยังเป็นของเรามั้ย หลีกเลี่ยงสัญญาที่ยึดสิทธิ์ในตัวเกมหรือชื่อแบรนด์ไปถาวร\n\nข้อสาม กำหนด Minimum Marketing Budget ให้ชัดเจน ไม่ใช่แค่สัญญาว่าจะช่วยโปรโมต แต่ต้องระบุตัวเลขหรือกิจกรรมจริง\n\nสัญญาที่ดีต้องแฟร์ทั้งสองฝ่าย อย่าปล่อยให้ความดีใจทำให้เรามองข้ามตัวหนังสือครับ", completed: false },
            { id: 23, cat: "B", catName: "Steam & Publishing", title: "Clip 23 — ทำไม Wishlist 60,000 คน ถึงยังชะล่าใจไม่ได้", body: "ยอด Wishlist 60,000 คนบน Steam ฟังดูเยอะ แต่วันเปิดตัวจริง คนที่กดซื้อทันทีอาจมีแค่ 10 ถึง 15 เปอร์เซ็นต์เท่านั้น\n\nนี่คือเรื่องจริงของ Conversion Rate ในวงการครับ คนกด Wishlist ไว้เพราะสนใจ แต่ไม่ได้แปลว่าเขาพร้อมจะจ่ายเงินในวันแรก\n\nยอด Wishlist ที่สะสมมานาน บางส่วนอาจเป็นคนที่ไม่Activeแล้ว หรือรอช่วงลดราคา\n\nหน้าที่ของ Dev ไม่ใช่แค่นับตัวเลข Wishlist แต่คือการทำกิจกรรมอัปเดตเดโม ปล่อย Devlog และกระตุ้นให้คนที่สนใจเปลี่ยนมาเป็นผู้ซื้อในสัปดาห์แรก\n\nตัวเลขบนกระดาษกินไม่ได้ ยอดขายจริงสัปดาห์แรกต่างหากคือของจริง", completed: false },
            { id: 24, cat: "B", catName: "Steam & Publishing", title: "Clip 24 — เงินกู้ Forgivable Loan ที่ช่วยชีวิตสตูดิโอ", body: "เงินกู้แบบ Forgivable Loan จาก Publisher คือตัวช่วยที่ทำให้สตูดิโอเรามีเงินจ่ายเงินเดือนทีม จนทำเกมขึ้น Kickstarter ได้สำเร็จ\n\nตอนนั้นทีมเราเงินหมดเกลี้ยง Sekai Project ยื่นข้อเสนอจ่ายเงินสำรองเลี้ยงทีมรายเดือน โดยมีเงื่อนไขว่า เงินก้อนนี้จะคืนก็ต่อเมื่อ Kickstarter ประสบความสำเร็จเท่านั้น\n\nถ้าแคมเปญล้มเหลว หนี้ก้อนนี้จะถูกยกเลิกทันที ไม่ต้องตามชดใช้\n\nข้อตกลงนี้ลดความกดดันให้ทีมเราได้มหาศาล ทำให้เรามีสมาธิตกแต่งเกมตัวอย่างให้ดีที่สุด จนแคมเปญระดมทุนผ่านเป้าไปได้ด้วยดี\n\nการหา Partner ที่เข้าใจและพร้อมรับความเสี่ยงร่วมกัน คือโชคดีใหญ่ของคนทำเกมครับ", completed: false },
            { id: 25, cat: "B", catName: "Steam & Publishing", title: "Clip 25 — ตราบาปจากการรับปากเกินตัวบน Kickstarter", body: "บทเรียนที่แพงที่สุดจากการทำ Kickstarter คืออย่ารับปากสิ่งที่เราไม่แน่ใจว่าจะทำได้ เพียงเพื่ออยากได้ยอดระดมทุนเพิ่ม\n\nตอนทำแคมเปญ M.A.S.S. Builder เราสัญญา Reward ไว้เยอะมาก ทั้งเสียงพากย์เต็มรูปแบบ และของแถมคัสตอมรายบุคคล\n\nพอระดมทุนได้จริง เงินก้อนนั้นถูกกลืนไปกับค่าผลิตของสัญญากว่าครึ่ง และกลายเป็นภาระงานที่ตามหลอกหลอนทีมหลังเกมวางขายไปหลายปี\n\nคำสัญญาต่อผู้สนับสนุนคือสิ่งศักดิ์สิทธิ์ครับ อะไรทำไม่ได้หรือยังไม่ชัวร์ อย่าใส่ลงใน Stretch Goal เด็ดขาด\n\nระดมทุนได้น้อยกว่าเดิมหน่อย แต่ทำได้จริง สบายใจกว่าเยอะครับ", completed: false },
            { id: 26, cat: "J", catName: "Mindset", title: "Clip 26 — ทำไมผมถึงแบนตัวเองจากการอ่านรีวิวบน Steam", body: "การแบนตัวเองไม่อ่านรีวิวบน Steam ด้วยตัวเอง คือคำสั่งของทีมงานที่ช่วยเซฟสภาพจิตใจผมไว้ได้มากที่สุด\n\nผมเป็นคนเอฟเฟกต์กับคอมเมนต์แง่ลบง่ายมาก พอด่านไหนมีคนบ่น หรือมีคนด่าเรื่องบาลานซ์ ผมจะรู้สึกนอยด์จนทำงานต่อไม่ได้ไปเป็นวันๆ\n\nทีมงานเลยตั้งกฎ ห้ามผมเปิดอ่านรีวิวบน Steam โดยตรง แต่ให้หัวหน้าทีมทำหน้าที่คัดกรอง สรุปเฉพาะเนื้อหาสาระและปัญหาจริงมาเป็น Report ให้ผมแก้\n\nวิธีนี้ทำให้ผมได้รับการปรับปรุงเกมตาม Feedback จริง โดยไม่ต้องรับแรงกระแทกทางอารมณ์ที่ไม่จำเป็น\n\nถ้าคุณรู้ตัวว่าเป็นคนจิตอ่อน ลองให้เพื่อนร่วมทีมช่วยกรองข้อความดูครับ", completed: false },
            { id: 27, cat: "B", catName: "Steam & Publishing", title: "Clip 27 — ตั้งราคาขายแบบ Regional Pricing บน Steam", body: "การตั้งราคาขายแบบ Regional Pricing บน Steam ต้องคิดให้ถี่ถ้วน ไม่ใช่แค่กดตามราคาแนะนำของระบบอย่างเดียว\n\nSteam มีระบบแนะนำราคาตามกำลังซื้อของแต่ละประเทศ ซึ่งช่วยให้คนในประเทศนั้นๆ เข้าถึงเกมเราได้ง่ายขึ้น\n\nแต่ข้อควรระวังคือ ถ้าเราตั้งราคาในบางภูมิภาคต่ำเกินไป อาจมีผู้เล่นมุด VPN ไปซื้อในราคาถูกจนทำลายรายได้หลักของเราได้\n\nกลยุทธ์คือ ยึดราคาฐานฝั่งอเมริกาเป็นหลัก แล้วปรับลดให้เหมาะสมในตลาดเกิดใหม่ โดยไม่ให้ส่วนต่างห่างกันจนเกิดการมุดซื้อ\n\nตั้งราคาให้แฟร์กับคนเล่น และแฟร์กับค่าน้ำค่าไฟของคนทำเกมด้วยครับ", completed: false },
            { id: 28, cat: "B", catName: "Steam & Publishing", title: "Clip 28 — วิธีขึ้นราคาช่วง 1.0.0 โดยไม่โดนด่า", body: "การปรับราคาเกมขึ้นเมื่อออกจาก Early Access เป็น 1.0.0 ทำได้ทันทีโดยที่ผู้เล่นไม่โกรธ แค่ต้องแจ้งล่วงหน้าและทำให้เห็นคุณค่าที่เพิ่มขึ้น\n\nเกม M.A.S.S. Builder ของเรามีการปรับราคาขึ้นเมื่อเวอร์ชันเต็มเสร็จสมบูรณ์\n\nสิ่งที่เราทำคือ ประกาศข่าวล่วงหน้าอย่างน้อย 1-2 เดือน บอกชัดเจนว่าจะปรับราคาขึ้นวันไหน พร้อมชี้แจงว่ามีคอนเทนต์ใหม่ ระบบใหม่ อะไรเพิ่มเข้ามาบ้าง\n\nนี่เป็นการให้เกียรติคนที่อุดหนุนเราตั้งแต่ช่วง Early Access ให้รู้สึกว่าเขาได้ซื้อในราคาคุ้มค่า\n\nและเปิดโอกาสให้คนที่เล็งอยู่ได้ตัดสินใจซื้อก่อนปรับราคาขึ้น ทุกคนเข้าใจได้ถ้าเราสื่อสารตรงไปตรงมาครับ", completed: false },
            { id: 29, cat: "C", catName: "Team & HR", title: "Clip 29 — ทำไมเงินเดือนผู้ก่อตั้งถึงตั้งไว้ต่ำที่สุด", body: "เงินเดือนของ Founder ในสตูดิโอเรา ตั้งไว้ต่ำที่สุดเท่าที่กฎหมายกำหนด เพื่อเอาเงินส่วนใหญ่ไปจ่ายให้ทีมงาน\n\nช่วงแรกที่ตั้งบริษัท เราไม่ได้มีเงินทุนมหาศาล สิ่งแรกที่ต้องตัดลดคือเงินเดือนของตัวผมเองและผู้ก่อตั้ง\n\nเราเอาเงินก้อนใหญ่ไปจ่ายเงินเดือนให้โปรแกรมเมอร์ อาร์ตติส และซื้ออาหารโกรเซอรีเข้ามาไว้ในออฟฟิศ เพื่อให้ทีมงานอยู่ได้โดยไม่ต้องกังวลเรื่องค่ากิน\n\nFounder คือคนรับความเสี่ยงสูงสุด แต่ความรอดของบริษัทขึ้นอยู่กับทีมงาน\n\nทำให้ทีมงานอิ่มท้อง มีอุปกรณ์ดีๆ ใช้ แล้วงานที่ดีจะตามมาเองครับ เงินส่วนของเราค่อยไปหวังผลตอนเกมขายได้", completed: false },
            { id: 30, cat: "C", catName: "Team & HR", title: "Clip 30 — การเชิญสมาชิกคนที่ 8 ออกจากทีม", body: "การตัดสินใจแยกทางกับสมาชิกคนที่แปด คือการตัดสินใจที่เจ็บปวดที่สุด แต่จำเป็นที่สุดเพื่ออนาคตของสตูดิโอ\n\nตอนนั้นออฟฟิศกำลังย้ายสถานที่ สมาชิกท่านนั้นมีเงื่อนไขชีวิตที่เปลี่ยนไป ทั้งเรื่องครอบครัวและการเดินทาง ทำให้ไม่สามารถทำงานแบบเต็มที่ร่วมกับทีมได้อีกต่อไป\n\nเรานั่งคุยกันตรงๆ ด้วยเหตุและผล ตกลงจ่ายค่าชดเชยอย่างสมเกียรติ แล้วแยกย้ายกันด้วยดี\n\nแม้จะรู้สึกแย่ แต่หน้าที่ของผู้นำคือการรักษาทิศทางและจังหวะการทำงานของทีมส่วนใหญ่ไว้\n\nเรื่องบางเรื่องไม่ได้มีใครผิด แค่ทิศทางชีวิตไม่ตรงกัน การคุยกันตรงๆ คือทางออกที่ดีที่สุดครับ", completed: false },
            { id: 31, cat: "C", catName: "Team & HR", title: "Clip 31 — Soft Skills สำคัญกว่า Hard Skills ในทีมเล็ก", body: "ในทีมทำเกมขนาด 7 คน คนที่ทักษะ Soft Skills ดี ปรับตัวง่าย และคุยรู้เรื่อง มีค่ามากกว่าคนเก่งขั้นเทพที่ทำงานร่วมกับคนอื่นไม่ได้\n\nทีมเล็กไม่มีพื้นที่สำหรับ Ego ครับ ถ้ามีโปรแกรมเมอร์เก่งระดับเทพ แต่ไม่ยอมรับฟังความคิดเห็นคนอื่น หรืออาร์ตติสที่เปลี่ยนงานตาม Feedback ไม่ได้ งานทั้งทีมจะสะงักทันที\n\nเราเลือกคนที่สื่อสารชัดเจน พร้อมเรียนรู้ และเปิดใจรับฟังก่อนเสมอ\n\nทักษะการทำเกมหัดกันได้ เขียนโค้ดฝึกกันได้ แต่ทัศนคติและการทำงานเป็นทีมคือสิ่งที่ดัดยาก\n\nอยากได้ทีมที่เดินไปได้ไกล ให้เลือกคนที่คุยกันรู้เรื่องครับ", completed: false },
            { id: 32, cat: "C", catName: "Team & HR", title: "Clip 32 — ออฟฟิศ 7 คนที่เลิกใช้ Trello แล้วใช้ระบบตะโกนข้ามโต๊ะ", body: "ออฟฟิศทำเกมขนาดเจ็ดคนของเรา เลิกใช้ Trello และ Stand-up meeting แล้วหันมาใช้ระบบตะโกนข้ามโต๊ะแทน\n\nตอนทีมยังเล็ก การนั่งคีย์การ์ดลงบอร์ด หรือจัดประชุมทุกเช้า มันกลายเป็น Overhead ที่กินเวลาโดยไม่จำเป็น\n\nในเมื่อเรานั่งอยู่ในห้องเดียวกัน อยากได้ asset อะไร อยากแก้บั๊กตรงไหน ก็แค่ตะโกนถามหรือเดินไปดูหน้าจอเพื่อนตรงๆ\n\nเราจะประชุมก็ต่อเมื่อมีเรื่องสำคัญที่ต้องตัดสินใจร่วมกันจริงๆ เท่านั้น\n\nเครื่องมือจัดการงานจำเป็นสำหรับทีมใหญ่ครับ แต่ถ้าทีมคุณนั่งมองหน้ากันอยู่แล้ว ใช้การสื่อสารตรงๆ ที่เร็วที่สุดดีกว่าครับ", completed: false },
            { id: 33, cat: "H", catName: "News / TCG", title: "Clip 33 — เมื่อโปรระดับโลกโดนแบนเพราะไม่สับกองการ์ด (Riftbound TCG)", body: "Koko Lopez โปรระดับโลกของเกม Riftbound TCG โดนสั่งแบนยาวถึงปี 2029 จากข้อหาเรียงกอง Rune โดยไม่สับการ์ดก่อนแข่ง\n\nกรณีนี้กลายเป็นประเด็นใหญ่ทันที เมื่อคลิปการแข่งย้อนหลังแสดงให้เห็นชัดเจนว่า เขาตั้งใจจัดเรียง Order Rune ให้อยู่ในตำแหน่งที่ต้องการ เพื่อดึงมาใช้งานได้เป๊ะๆ ทุกรอบ\n\nตอนแรกเจ้าตัวอ้างว่าเป็นความเข้าใจผิด แต่พอหลักฐานมัดแน่นจากหลายทัวร์นาเมนต์ จนทีมต้นสังกัดสั่งปลด สุดท้าย Riot ก็ออกบทลงโทษแบนยาวถึง 3 ปี\n\nเรื่องนี้สอนคนทำเกมและคนแข่งเกมชัดเจนครับว่า วงการการ์ดเกมต่อให้กลไกสนุกแค่ไหน แต่ถ้าไร้ความโปร่งใสและขาด Fair Play สังคมก็พร้อมจะถอดคุณออกจากวงการทันทีครับ", completed: false },
            { id: 34, cat: "H", catName: "News / Esports", title: "Clip 34 — เมื่อสตรีมเมอร์ระดับโลก Ludwig ถอดใจเพราะนโยบาย Esports", body: "Ludwig สตรีมเมอร์ชื่อดังเจ้าของทีม Esports ออกมาเปรยว่าอาจต้องยุบทีมและถอยออกจากวงการ เพราะทนรับนโยบายและการตัดสินใจแย่ๆ ไม่ไหว\n\nการทำทีม Esports ยุคนี้ใช้เงินมหาศาลครับ แต่สิ่งที่ทีมต้องเจอสวนทางกัน คือนโยบายของทางค่ายเกมที่ปรับเปลี่ยนตามใจชอบ กฎเกณฑ์ที่ไม่เอื้อให้คนทำทีมอยู่รอด และการสื่อสารที่ย่ำแย่\n\nพอคนที่มีทั้งเงิน Passion และฐานแฟนคลับแน่นอย่าง Ludwig ยังออกมาตัดพ้อว่าเริ่มไม่คุ้มที่จะสู้ต่อ มันส่งสัญญาณเตือนคนทำเกมทั่วโลกลอยมาเลยครับ\n\nการสร้างระบบแข่งขันถ้าคิดแต่จะดึงเค้กเข้าฝั่งตัวเอง โดยไม่เหลียวมองคนลงทุนทำทีม วันนึงจะไม่มีใครเหลือมาช่วยแบกวงการให้ครับ", completed: false },
            { id: 35, cat: "D", catName: "Design & Tech", title: "Clip 35 — เมื่อมอดเดอร์ใช้ AI แก้เกมเก่า หรือเราแค่คิดถึงวันวาน", body: "ยุคนี้ AI ช่วยให้มอดเดอร์รังสรรค์ Client และแก้เกมเก่าอายุยี่สิบปีได้อย่างทะลุขอบเขต จนเกิดคำถามว่า เรากำลังสนุกกับเกม หรือแค่อาparentคิดถึงอดีตกันแน่\n\nเครื่องมือ Coding Agent ยุคนี้ช่วยทะลายขีดจำกัดเดิมๆ งานที่เคยต้องใช้เวลาเป็นปี มอดเดอร์สามารถเสกให้เสร็จได้ในไม่กี่วัน\n\nแต่พอเราสามารถแก้เกมเก่าให้กลายเป็นอะไรก็ได้ตามใจชอบ บางทีสิ่งที่เราโหยหาอาจไม่ใช่แค่ระบบที่ทันสมัยขึ้น แต่คือความรู้สึกสมัยเด็กที่ได้นั่งเล่นเกมนั้นเป็นครั้งแรก\n\nAI ช่วยเติมเต็มจินตนาการและสร้างสิ่งใหม่ในเกมเก่าได้จริงครับ แต่เสน่ห์ที่แท้จริงคือการรักษาสมดุลระหว่าง Nostalgia กับความสดใหม่ให้อยู่คู่กันอย่างลงตัวครับ", completed: false }
        ];

        let scripts = JSON.parse(localStorage.getItem('vermillion_scripts')) || initialScripts;
        let activeEditId = null;

        function saveToStorage() {
            localStorage.setItem('vermillion_scripts', JSON.stringify(scripts));
        }

        function countWords(text) {
            return text.trim().split(/\s+/).filter(Boolean).length;
        }

        function renderScripts() {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = '';

            let completedCount = 0;

            scripts.forEach(script => {
                if (script.completed) completedCount++;

                const wordCount = countWords(script.body);
                const estTime = Math.round((wordCount / 140) * 45);

                const card = document.createElement('div');
                card.className = `card rounded-xl p-5 flex flex-col justify-between script-card ${script.completed ? 'card-completed' : ''}`;
                card.setAttribute('data-category', script.cat);
                card.setAttribute('data-id', script.id);

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded tag-${script.cat.toLowerCase()}">Cat ${script.cat}: ${script.catName}</span>
                            <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer select-none">
                                <input type="checkbox" ${script.completed ? 'checked' : ''} onchange="toggleComplete(${script.id})" class="w-4 h-4 rounded bg-gray-900 border-gray-700 text-emerald-500 focus:ring-0 focus:ring-offset-0">
                                <span class="${script.completed ? 'text-emerald-400 font-semibold' : 'text-gray-400'}">${script.completed ? 'Done ✅' : 'Mark Done'}</span>
                            </label>
                        </div>
                        <h3 class="text-base font-bold text-white mb-2">${script.title}</h3>
                        <p class="text-sm text-gray-300 leading-relaxed mb-4 whitespace-pre-line">${script.body}</p>
                    </div>
                    <div class="pt-4 border-t border-gray-800 flex items-center justify-between text-xs text-gray-400">
                        <span>${wordCount} words (~${estTime}s)</span>
                        <div class="flex gap-2">
                            <button onclick="copyScriptText(${script.id})" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-2.5 py-1 rounded text-xs transition">📋 Copy</button>
                            <button onclick="openModal(${script.id})" class="bg-blue-900/60 hover:bg-blue-800 text-blue-200 border border-blue-700/50 px-2.5 py-1 rounded text-xs transition">✏️ Edit</button>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            document.getElementById('counterBadge').textContent = `${scripts.length} CLIPS (${completedCount} DONE)`;
            filterScripts();
        }

        function toggleComplete(id) {
            const script = scripts.find(s => s.id === id);
            if (script) {
                script.completed = !script.completed;
                saveToStorage();
                renderScripts();
            }
        }

        function openModal(id) {
            const script = scripts.find(s => s.id === id);
            if (!script) return;

            activeEditId = id;
            document.getElementById('modalTitle').textContent = `Editing ${script.title}`;
            const textarea = document.getElementById('modalTextarea');
            textarea.value = script.body;
            updateModalWordCount();

            textarea.oninput = updateModalWordCount;

            document.getElementById('editorModal').classList.remove('hidden');
            document.getElementById('editorModal').classList.add('flex');
        }

        function updateModalWordCount() {
            const val = document.getElementById('modalTextarea').value;
            const words = countWords(val);
            const estTime = Math.round((words / 140) * 45);
            document.getElementById('modalWordCounter').textContent = `Word count: ${words} words (~${estTime}s target)`;
        }

        function closeModal() {
            document.getElementById('editorModal').classList.remove('flex');
            document.getElementById('editorModal').classList.add('hidden');
            activeEditId = null;
        }

        function saveModalChanges() {
            if (!activeEditId) return;
            const script = scripts.find(s => s.id === activeEditId);
            if (script) {
                script.body = document.getElementById('modalTextarea').value;
                saveToStorage();
                renderScripts();
                closeModal();
            }
        }

        function copyModalText() {
            const val = document.getElementById('modalTextarea').value;
            navigator.clipboard.writeText(val);
            alert("Script text copied to clipboard!");
        }

        function copyScriptText(id) {
            const script = scripts.find(s => s.id === id);
            if (script) {
                navigator.clipboard.writeText(script.body);
                alert(`Copied ${script.title} to clipboard!`);
            }
        }

        function filterScripts() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const catVal = document.getElementById('categoryFilter').value;
            const statusVal = document.getElementById('statusFilter').value;

            const cards = document.querySelectorAll('.script-card');

            cards.forEach(card => {
                const id = parseInt(card.getAttribute('data-id'));
                const script = scripts.find(s => s.id === id);
                if (!script) return;

                const matchesSearch = script.title.toLowerCase().includes(searchVal) || script.body.toLowerCase().includes(searchVal);
                const matchesCategory = (catVal === 'all') || (script.cat === catVal);
                const matchesStatus = (statusVal === 'all') || (statusVal === 'completed' && script.completed) || (statusVal === 'pending' && !script.completed);

                if (matchesSearch && matchesCategory && matchesStatus) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function sortScripts() {
            const sortVal = document.getElementById('sortOrder').value;

            if (sortVal === 'clip-asc') {
                scripts.sort((a, b) => a.id - b.id);
            } else if (sortVal === 'clip-desc') {
                scripts.sort((a, b) => b.id - a.id);
            } else if (sortVal === 'words-desc') {
                scripts.sort((a, b) => countWords(b.body) - countWords(a.body));
            } else if (sortVal === 'words-asc') {
                scripts.sort((a, b) => countWords(a.body) - countWords(b.body));
            }

            renderScripts();
        }

        // Initialize dashboard
        renderScripts();
    </script>
</body>
