<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vermillion Shorts — Master Content & Topic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: #131722; border: 1px solid #232a3b; transition: all 0.2s ease; }
        .card:hover { border-color: #3b82f6; }
        .card-completed { opacity: 0.6; border-color: #10b981 !important; }
        .card-discarded { opacity: 0.45; border-color: #ef4444 !important; }
        .tag-a { background: #1e3a8a; color: #93c5fd; }
        .tag-b { background: #14532d; color: #86efac; }
        .tag-c { background: #701a75; color: #f0abfc; }
        .tag-d { background: #7c2d12; color: #fdba74; }
        .tag-f { background: #312e81; color: #c7d2fe; }
        .tag-g { background: #365314; color: #bef264; }
        .tag-h { background: #831843; color: #f472b6; }
        .tag-i { background: #134e4a; color: #99f6e4; }
        .tag-j { background: #4c1d95; color: #ddd6fe; }
        .tag-l { background: #3f6212; color: #d9f99d; }
    </style>
</head>
<body class="p-6 max-w-[1400px] mx-auto">
    <!-- Header Controls -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-gray-800 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-bold text-white tracking-wide">VERMILLION SHORTS — MASTER TOPIC DASHBOARD</h1>
                <span id="counterBadge" class="bg-blue-900/50 text-blue-400 border border-blue-700/50 text-xs px-2.5 py-0.5 rounded-full font-semibold">0 CLIPS</span>
            </div>
            <p class="text-sm text-gray-400 mt-1">Topic overview, script editing, teleprompter view, and cloud sync</p>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <button onclick="openAddTopicModal()" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold text-sm px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-amber-900/30">
                <span>💡</span> Add Topic Idea
            </button>

            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-blue-900/30">
                <span>➕</span> Add New Script
            </button>

            <input type="text" id="searchInput" onkeyup="filterScripts()" placeholder="Search topics..." class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-4 py-2 text-white w-44 focus:outline-none focus:border-blue-500">
            
            <select id="categoryFilter" onchange="filterScripts()" class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <option value="all">All Categories</option>
                <option value="A">Cat A: Personal Journey</option>
                <option value="B">Cat B: Steam & Publishing</option>
                <option value="C">Cat C: Team & HR</option>
                <option value="D">Cat D: Design Philosophy</option>
                <option value="F">Cat F: Engine & Tech</option>
                <option value="G">Cat G: Money & Runway</option>
                <option value="H">Cat H: News & Industry</option>
                <option value="I">Cat I: Career & Education</option>
                <option value="J">Cat J: Mindset</option>
                <option value="L">Cat L: Events & Business</option>
            </select>

            <select id="statusFilter" onchange="filterScripts()" class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <option value="all">All Progress</option>
                <option value="pending">⏳ Pending</option>
                <option value="completed">✅ Done</option>
                <option value="discarded">❌ Discarded</option>
            </select>

            <select id="sortOrder" onchange="sortScripts()" class="bg-gray-900 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                <option value="clip-asc">Sort: ID 1 ➔ Max</option>
                <option value="clip-desc">Sort: ID Max ➔ 1</option>
                <option value="words-desc">Sort: Longest Word Count</option>
                <option value="words-asc">Sort: Shortest Word Count</option>
            </select>
        </div>
    </header>

    <!-- Compact Topics List View -->
    <main class="flex flex-col gap-3" id="scriptGrid">
        <!-- Topic Bars generated dynamically via JS -->
    </main>

    <!-- Modal: Edit / View Full Script -->
    <div id="editorModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-3xl w-full p-6 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <span id="modalMeta" class="text-xs font-semibold px-2.5 py-1 rounded">Category</span>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold text-sm">✕ Close</button>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Topic Title</label>
                <input type="text" id="modalTitleInput" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white font-bold text-base focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Script Body (Spoken Thai)</label>
                <textarea id="modalTextarea" class="w-full h-72 bg-gray-950 border border-gray-800 rounded-xl p-4 text-white font-mono text-base leading-relaxed focus:outline-none focus:border-blue-500" placeholder="Edit script content..."></textarea>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-400">
                <span id="modalWordCounter">Word count: 0 words (~0s)</span>
                <div class="flex gap-2">
                    <button onclick="copyModalText()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition">📋 Copy Script</button>
                    <button onclick="saveModalChanges()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold transition">💾 Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add New Full Script -->
    <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-2xl w-full p-6 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h2 class="text-lg font-bold text-white">➕ Add New Script</h2>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-white font-bold">✕ Close</button>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Topic ID #</label>
                    <input type="number" id="newClipNumber" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Category</label>
                    <select id="newClipCategory" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                        <option value="A|Personal Journey">Cat A: Personal Journey</option>
                        <option value="B|Steam & Publishing">Cat B: Steam & Publishing</option>
                        <option value="C|Team & HR">Cat C: Team & HR</option>
                        <option value="D|Design Philosophy">Cat D: Design Philosophy</option>
                        <option value="F|Engine & Tech">Cat F: Engine & Tech</option>
                        <option value="G|Money & Runway">Cat G: Money & Runway</option>
                        <option value="H|News & Industry">Cat H: News & Industry</option>
                        <option value="I|Career & Education">Cat I: Career & Education</option>
                        <option value="J|Mindset">Cat J: Mindset</option>
                        <option value="L|Events & Business">Cat L: Events & Business</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Topic Title (Thai)</label>
                <input type="text" id="newClipTitle" placeholder="e.g. หัวข้อใหม่สั้นๆ" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Script Body (Spoken Thai with Preview Hook)</label>
                <textarea id="newClipBody" oninput="updateAddWordCount()" class="w-full h-44 bg-gray-950 border border-gray-800 rounded-xl p-4 text-white font-mono text-sm leading-relaxed focus:outline-none focus:border-blue-500" placeholder="Type or paste spoken Thai script here..."></textarea>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-400">
                <span id="addWordCounter">Word count: 0 words (~0s)</span>
                <div class="flex gap-2">
                    <button onclick="closeAddModal()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition">Cancel</button>
                    <button onclick="addNewScript()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-semibold transition">✨ Publish Topic</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add New Topic Idea -->
    <div id="addTopicModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-xl w-full p-6 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h2 class="text-lg font-bold text-white">💡 Add New Unscripted Topic Seed</h2>
                <button onclick="closeAddTopicModal()" class="text-gray-400 hover:text-white font-bold">✕ Close</button>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Topic ID #</label>
                    <input type="text" id="newTopicId" placeholder="e.g. 72" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Category</label>
                    <select id="newTopicCategory" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-amber-500">
                        <option value="A|Personal Journey">Cat A: Personal Journey</option>
                        <option value="B|Steam & Publishing">Cat B: Steam & Publishing</option>
                        <option value="C|Team & HR">Cat C: Team & HR</option>
                        <option value="D|Design Philosophy">Cat D: Design Philosophy</option>
                        <option value="F|Engine & Tech">Cat F: Engine & Tech</option>
                        <option value="G|Money & Runway">Cat G: Money & Runway</option>
                        <option value="H|News & Industry">Cat H: News & Industry</option>
                        <option value="I|Career & Education">Cat I: Career & Education</option>
                        <option value="J|Mindset">Cat J: Mindset</option>
                        <option value="L|Events & Business">Cat L: Events & Business</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Topic Title</label>
                <input type="text" id="newTopicTitle" placeholder="e.g. ประสบการณ์การทำเกมช่วงขาดทุน" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Core Editorial Angle / Talking Points</label>
                <textarea id="newTopicAngle" class="w-full h-24 bg-gray-950 border border-gray-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500" placeholder="Summarize core talking points..."></textarea>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-400 pt-2 border-t border-gray-800">
                <span class="text-amber-400/80">Creates a draft topic card ready for script expansion</span>
                <div class="flex gap-2">
                    <button onclick="closeAddTopicModal()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition">Cancel</button>
                    <button onclick="addNewTopicSeed()" class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-2 rounded-lg font-semibold transition">💡 Save Topic Seed</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scripts = [];
        let activeEditId = null;

        // Clean raw title by removing obsolete "Clip XX — " prefixes
        function sanitizeTitle(title) {
            return title.replace(/^Clip\s+\d+\s*—\s*/i, '').trim();
        }

        async function loadScriptsFromKV() {
            try {
                const response = await fetch('/api/get-scripts');
                const data = await response.json();
                if (data && data.length > 0) {
                    scripts = data;
                }
                renderScripts();
            } catch (err) {
                console.error("Failed to load scripts from cloud storage:", err);
            }
        }

        async function saveToKV() {
            try {
                await fetch('/api/save-scripts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(scripts)
                });
            } catch (err) {
                console.error("Failed to save scripts to cloud storage:", err);
            }
        }

        function countWords(text) {
            return text ? text.trim().split(/\s+/).filter(Boolean).length : 0;
        }

        function renderScripts() {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = '';

            let doneCount = 0;

            scripts.forEach(script => {
                const isDone = script.status === "completed" || script.completed === true;
                const isDiscarded = script.status === "discarded";

                if (isDone) doneCount++;

                const wordCount = countWords(script.body);
                const estTime = Math.round((wordCount / 140) * 45);
                const currentStatus = script.status || (script.completed ? 'completed' : 'pending');
                const displayTitle = sanitizeTitle(script.title);

                let cardClass = "card rounded-xl px-5 py-3.5 flex items-center justify-between script-card cursor-pointer hover:bg-gray-800/60";
                if (isDone) cardClass += " card-completed";
                if (isDiscarded) cardClass += " card-discarded";

                const card = document.createElement('div');
                card.className = cardClass;
                card.setAttribute('data-category', script.cat);
                card.setAttribute('data-id', script.id);

                card.innerHTML = `
                    <div class="flex items-center gap-4 flex-1 min-w-0 mr-4" onclick="openModal(${script.id})">
                        <span class="text-xs font-mono font-bold text-gray-500 w-8">#${script.id}</span>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded tag-${script.cat.toLowerCase()} shrink-0">Cat ${script.cat}</span>
                        <h3 class="text-sm font-bold text-white truncate hover:text-blue-400 transition">${displayTitle}</h3>
                    </div>

                    <div class="flex items-center gap-4 shrink-0" onclick="event.stopPropagation()">
                        <span class="text-xs text-gray-400 font-mono hidden sm:inline">${wordCount} words (~${estTime}s)</span>
                        <select onchange="changeStatus(${script.id}, this.value)" class="bg-gray-900 border border-gray-700 text-xs rounded px-2 py-1 font-semibold text-gray-200 focus:outline-none focus:border-blue-500 cursor-pointer">
                            <option value="pending" ${currentStatus === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="completed" ${currentStatus === 'completed' ? 'selected' : ''}>✅ Done</option>
                            <option value="discarded" ${currentStatus === 'discarded' ? 'selected' : ''}>❌ Discard</option>
                        </select>
                        <button onclick="openModal(${script.id})" class="bg-blue-900/60 hover:bg-blue-800 text-blue-200 border border-blue-700/50 px-2.5 py-1 rounded text-xs transition">✏️ View / Edit</button>
                    </div>
                `;

                grid.appendChild(card);
            });

            document.getElementById('counterBadge').textContent = `${scripts.length} CLIPS (${doneCount} DONE)`;
            filterScripts();
        }

        function changeStatus(id, newStatus) {
            const script = scripts.find(s => s.id === id);
            if (script) {
                script.status = newStatus;
                script.completed = (newStatus === "completed");
                renderScripts();
                saveToKV();
            }
        }

        function openModal(id) {
            const script = scripts.find(s => s.id === id);
            if (!script) return;

            activeEditId = id;
            
            const metaTag = document.getElementById('modalMeta');
            metaTag.textContent = `#${script.id} | Cat ${script.cat}: ${script.catName}`;
            metaTag.className = `text-xs font-semibold px-2.5 py-1 rounded tag-${script.cat.toLowerCase()}`;

            const titleInput = document.getElementById('modalTitleInput');
            titleInput.value = sanitizeTitle(script.title);

            const textarea = document.getElementById('modalTextarea');
            textarea.value = script.body;
            updateModalWordCount();

            textarea.oninput = updateModalWordCount;

            document.getElementById('editorModal').classList.remove('hidden');
            document.getElementById('editorModal').classList.add('flex');
        }

        function updateModalWordCount() {
            const val = document.getElementById('modalTextarea').value;
            const words = countWords(val);
            const estTime = Math.round((words / 140) * 45);
            document.getElementById('modalWordCounter').textContent = `Word count: ${words} words (~${estTime}s target)`;
        }

        function closeModal() {
            document.getElementById('editorModal').classList.remove('flex');
            document.getElementById('editorModal').classList.add('hidden');
            activeEditId = null;
        }

        function saveModalChanges() {
            if (!activeEditId) return;
            const script = scripts.find(s => s.id === activeEditId);
            if (script) {
                script.title = document.getElementById('modalTitleInput').value.trim();
                script.body = document.getElementById('modalTextarea').value;
                renderScripts();
                saveToKV();
                closeModal();
            }
        }

        function copyModalText() {
            const val = document.getElementById('modalTextarea').value;
            navigator.clipboard.writeText(val);
            alert("Script text copied to clipboard!");
        }

        function openAddModal() {
            const nextId = scripts.length > 0 ? Math.max(...scripts.map(s => s.id)) + 1 : 1;
            document.getElementById('newClipNumber').value = nextId;
            document.getElementById('newClipTitle').value = '';
            document.getElementById('newClipBody').value = '';
            updateAddWordCount();

            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('flex');
            document.getElementById('addModal').classList.add('hidden');
        }

        function updateAddWordCount() {
            const val = document.getElementById('newClipBody').value;
            const words = countWords(val);
            const estTime = Math.round((words / 140) * 45);
            document.getElementById('addWordCounter').textContent = `Word count: ${words} words (~${estTime}s target)`;
        }

        function addNewScript() {
            const clipNum = parseInt(document.getElementById('newClipNumber').value) || (scripts.length + 1);
            const [catCode, catLabel] = document.getElementById('newClipCategory').value.split('|');
            const title = document.getElementById('newClipTitle').value.trim();
            const body = document.getElementById('newClipBody').value.trim();

            if (!title || !body) {
                alert('Please enter both a title and script body text.');
                return;
            }

            const newScript = {
                id: clipNum,
                cat: catCode,
                catName: catLabel,
                title: title,
                body: body,
                status: "pending",
                completed: false
            };

            scripts.push(newScript);
            scripts.sort((a, b) => a.id - b.id);

            renderScripts();
            saveToKV();
            closeAddModal();
        }

        function openAddTopicModal() {
            const nextTopicNum = scripts.length > 0 ? Math.max(...scripts.map(s => s.id)) + 1 : 1;
            document.getElementById('newTopicId').value = nextTopicNum;
            document.getElementById('newTopicTitle').value = '';
            document.getElementById('newTopicAngle').value = '';

            document.getElementById('addTopicModal').classList.remove('hidden');
            document.getElementById('addTopicModal').classList.add('flex');
        }

        function closeAddTopicModal() {
            document.getElementById('addTopicModal').classList.remove('flex');
            document.getElementById('addTopicModal').classList.add('hidden');
        }

        function addNewTopicSeed() {
            const topicId = parseInt(document.getElementById('newTopicId').value) || (scripts.length + 1);
            const [catCode, catLabel] = document.getElementById('newTopicCategory').value.split('|');
            const title = document.getElementById('newTopicTitle').value.trim();
            const angle = document.getElementById('newTopicAngle').value.trim();

            if (!title || !angle) {
                alert('Please provide a title and core talking points.');
                return;
            }

            const formattedSeedBody = `• Angle: ${angle}\n\n[Unscripted topic seed - ready for full spoken Thai expansion]`;

            const newTopicScript = {
                id: topicId,
                cat: catCode,
                catName: catLabel,
                title: title,
                body: formattedSeedBody,
                isSeed: true,
                status: "pending",
                completed: false
            };

            scripts.push(newTopicScript);
            scripts.sort((a, b) => a.id - b.id);

            renderScripts();
            saveToKV();
            closeAddTopicModal();
        }

        function filterScripts() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const catVal = document.getElementById('categoryFilter').value;
            const statusVal = document.getElementById('statusFilter').value;

            const cards = document.querySelectorAll('.script-card');

            cards.forEach(card => {
                const id = parseInt(card.getAttribute('data-id'));
                const script = scripts.find(s => s.id === id);
                if (!script) return;

                const currentStatus = script.status || (script.completed ? 'completed' : 'pending');
                const displayTitle = sanitizeTitle(script.title);

                const matchesSearch = displayTitle.toLowerCase().includes(searchVal) || script.body.toLowerCase().includes(searchVal);
                const matchesCategory = (catVal === 'all') || (script.cat === catVal);
                const matchesStatus = (statusVal === 'all') || (currentStatus === statusVal);

                if (matchesSearch && matchesCategory && matchesStatus) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function sortScripts() {
            const sortVal = document.getElementById('sortOrder').value;

            if (sortVal === 'clip-asc') {
                scripts.sort((a, b) => a.id - b.id);
            } else if (sortVal === 'clip-desc') {
                scripts.sort((a, b) => b.id - a.id);
            } else if (sortVal === 'words-desc') {
                scripts.sort((a, b) => countWords(b.body) - countWords(a.body));
            } else if (sortVal === 'words-asc') {
                scripts.sort((a, b) => countWords(a.body) - countWords(b.body));
            }

            renderScripts();
        }

        // Initialize from cloud KV
        loadScriptsFromKV();
    </script>
</body>
</html>
