<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Shorts Script Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .card-dragging {
      opacity: 0.4;
      border: 2px dashed #6366f1 !important;
    }
    .drag-over {
      border-top: 4px solid #6366f1 !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

  <!-- Header & Toolbar -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- Title & Branding -->
      <div class="flex items-center gap-3">
        <div class="bg-red-600/20 text-red-500 p-2.5 rounded-xl border border-red-500/30">
          <i class="fa-solid fa-clapperboard text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            Shorts Script Dashboard
          </h1>
          <p class="text-xs text-slate-400">Managing <span id="script-count">0</span> scripts</p>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openApiKeyModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-sm font-medium px-3.5 py-2 rounded-lg flex items-center gap-2 transition">
          <i class="fa-solid fa-key text-amber-400"></i>
          <span>API Key</span>
        </button>

        <button onclick="fetchYouTubeViews()" id="btn-fetch-views" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-3.5 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-rotate text-xs"></i>
          <span>Fetch Views</span>
        </button>

        <button onclick="exportJson()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-3.5 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-emerald-600/20">
          <i class="fa-solid fa-download text-xs"></i>
          <span>Export JSON</span>
        </button>

        <button onclick="addNewScript()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg flex items-center gap-2 transition">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>New Script</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Filter & Search Bar -->
  <section class="max-w-7xl mx-auto w-full px-6 pt-6">
    <div class="flex flex-col sm:flex-row gap-4 justify-between items-center bg-slate-900/50 p-3 rounded-xl border border-slate-800">
      
      <!-- Search Input -->
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
        <input type="text" id="search-input" oninput="filterScripts()" placeholder="Search title or content..." 
               class="w-full bg-slate-800/80 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <!-- Status Filters -->
      <div class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0">
        <button onclick="setStatusFilter('ALL')" class="filter-btn active bg-slate-800 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-700 transition" data-status="ALL">All</button>
        <button onclick="setStatusFilter('Draft')" class="filter-btn text-slate-400 text-xs font-medium px-3 py-1.5 rounded-lg border border-transparent hover:border-slate-800 transition" data-status="Draft">Draft</button>
        <button onclick="setStatusFilter('Ready to Record')" class="filter-btn text-slate-400 text-xs font-medium px-3 py-1.5 rounded-lg border border-transparent hover:border-slate-800 transition" data-status="Ready to Record">Ready</button>
        <button onclick="setStatusFilter('Recorded')" class="filter-btn text-slate-400 text-xs font-medium px-3 py-1.5 rounded-lg border border-transparent hover:border-slate-800 transition" data-status="Recorded">Recorded</button>
      </div>

    </div>
  </section>

  <!-- Main Grid Area -->
  <main class="max-w-7xl mx-auto w-full px-6 py-6 flex-1">
    <div id="script-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Dynamic Script Cards inserted here -->
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all transform translate-y-20 opacity-0 z-50">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-msg" class="text-sm font-medium">Notification</span>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-key text-amber-400"></i> YouTube API Key
        </h3>
        <button onclick="closeApiKeyModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs text-slate-400 mb-4">
        Enter your Google Cloud Data API Key to fetch view statistics directly. Key is saved locally in your browser.
      </p>
      <input type="text" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="closeApiKeyModal()" class="px-4 py-2 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 text-slate-300">Cancel</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Save Key</button>
      </div>
    </div>
  </div>

  <!-- Script Editor Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white" id="modal-title-text">Edit Script</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-4 overflow-y-auto custom-scrollbar pr-2 flex-1">
        <input type="hidden" id="edit-id">

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Title</label>
          <input type="text" id="edit-title" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Category</label>
            <input type="text" id="edit-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Status</label>
            <select id="edit-status" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="Draft">Draft</option>
              <option value="Ready to Record">Ready to Record</option>
              <option value="Recorded">Recorded</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">YouTube Video ID / URL</label>
            <input type="text" id="edit-youtube-id" placeholder="e.g. dQw4w9WgXcQ" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Manual Views Override</label>
            <input type="number" id="edit-views" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Script Content</label>
          <textarea id="edit-body" rows="8" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 leading-relaxed custom-scrollbar"></textarea>
        </div>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-slate-800 mt-4">
        <button onclick="deleteCurrentScript()" class="px-4 py-2 rounded-lg text-sm bg-red-900/30 hover:bg-red-900/50 text-red-400 border border-red-800/50">Delete</button>
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 text-slate-300">Cancel</button>
          <button onclick="saveScriptChanges()" class="px-4 py-2 rounded-lg text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Save Script</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let scripts = [];
    let currentFilter = 'ALL';
    let draggedIndex = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadScriptsData();
    });

    async function loadScriptsData() {
      try {
        const res = await fetch('data/scripts.json');
        if (res.ok) {
          const data = await res.json();
          scripts = Array.isArray(data) ? data : (data.scripts || data.clips || []);
          
          const localCache = localStorage.getItem('shorts_scripts_overrides');
          if (localCache) {
            try {
              const overrides = JSON.parse(localCache);
              if (Array.isArray(overrides) && overrides.length > 0) {
                scripts = mergeScriptsWithOverrides(scripts, overrides);
              }
            } catch (e) {
              console.warn("Local override merge skipped", e);
            }
          }
        }
      } catch (err) {
        console.error("Error loading scripts JSON:", err);
        showToast('Error loading scripts.json', 'error');
      }

      scripts.forEach((item, idx) => {
        if (item.sort_order === undefined) item.sort_order = idx + 1;
      });
      scripts.sort((a, b) => a.sort_order - b.sort_order);

      renderScripts();
    }

    function mergeScriptsWithOverrides(fetched, saved) {
      const savedMap = new Map(saved.map(s => [s.id, s]));
      const result = [];

      saved.forEach(s => {
        const fresh = fetched.find(f => f.id === s.id);
        if (fresh) {
          result.push({ ...fresh, ...s });
        } else {
          result.push(s);
        }
      });

      fetched.forEach(f => {
        if (!savedMap.has(f.id)) {
          result.push(f);
        }
      });

      return result;
    }

    function saveState() {
      localStorage.setItem('shorts_scripts_overrides', JSON.stringify(scripts));
      document.getElementById('script-count').innerText = scripts.length;
    }

    function renderScripts() {
      const container = document.getElementById('script-container');
      container.innerHTML = '';

      const searchVal = document.getElementById('search-input').value.toLowerCase();

      const filtered = scripts.filter(s => {
        const matchesStatus = currentFilter === 'ALL' || s.status === currentFilter;
        const matchesSearch = (s.title && s.title.toLowerCase().includes(searchVal)) || 
                              (s.script_body && s.script_body.toLowerCase().includes(searchVal));
        return matchesStatus && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500">
            <i class="fa-solid fa-folder-open text-4xl mb-3 block opacity-40"></i>
            <p class="text-sm">No scripts found.</p>
          </div>
        `;
      } else {
        filtered.forEach((script) => {
          const realIndex = scripts.findIndex(item => item.id === script.id);
          const card = createCardElement(script, realIndex);
          container.appendChild(card);
        });
      }

      document.getElementById('script-count').innerText = scripts.length;
    }

    function createCardElement(script, index) {
      const card = document.createElement('div');
      card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between hover:border-slate-700 transition shadow-lg relative group";
      card.draggable = true;

      card.addEventListener('dragstart', (e) => handleDragStart(e, index, card));
      card.addEventListener('dragover', (e) => handleDragOver(e, card));
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', (e) => handleDrop(e, index, card));
      card.addEventListener('dragend', () => handleDragEnd(card));

      let statusBg = 'bg-slate-800 text-slate-400 border-slate-700';
      if (script.status === 'Ready to Record') statusBg = 'bg-emerald-900/30 text-emerald-400 border-emerald-800/50';
      if (script.status === 'Recorded') statusBg = 'bg-blue-900/30 text-blue-400 border-blue-800/50';

      const formattedViews = script.views ? Number(script.views).toLocaleString() : '0';

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2">
              <span class="cursor-grab text-slate-600 hover:text-slate-400 transition" title="Drag to reorder">
                <i class="fa-solid fa-grip-vertical"></i>
              </span>
              <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">${script.category || 'General'}</span>
            </div>
            <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full border ${statusBg}">${script.status || 'Draft'}</span>
          </div>

          <h3 class="font-bold text-slate-100 text-base mb-2 leading-snug cursor-pointer hover:text-indigo-400 transition" onclick="openEditModal(${script.id})">
            ${script.title}
          </h3>

          <p class="text-xs text-slate-400 line-clamp-4 leading-relaxed mb-4 whitespace-pre-line">
            ${script.script_body}
          </p>
        </div>

        <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
          <div class="flex items-center gap-2 text-slate-400" title="YouTube Views">
            <i class="fa-solid fa-eye text-slate-500"></i>
            <span>${formattedViews}</span>
          </div>

          <div class="flex items-center gap-2">
            <button class="btn-copy bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-md border border-slate-700 transition flex items-center gap-1.5" title="Copy Script">
              <i class="fa-solid fa-copy text-xs"></i>
              <span>Copy</span>
            </button>
            <button onclick="openEditModal(${script.id})" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-md border border-slate-700 transition" title="Edit">
              <i class="fa-solid fa-pen-to-square text-xs"></i>
            </button>
          </div>
        </div>
      `;

      card.querySelector('.btn-copy').addEventListener('click', () => {
        navigator.clipboard.writeText(script.script_body).then(() => {
          showToast('Script copied to clipboard!');
        });
      });

      return card;
    }

    function handleDragStart(e, index, card) {
      draggedIndex = index;
      card.classList.add('card-dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e, card) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    }

    function handleDrop(e, targetIndex, card) {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (draggedIndex === null || draggedIndex === targetIndex) return;

      const movedItem = scripts.splice(draggedIndex, 1)[0];
      scripts.splice(targetIndex, 0, movedItem);

      scripts.forEach((item, idx) => {
        item.sort_order = idx + 1;
      });

      saveState();
      renderScripts();
      showToast('Reordered script queue');
    }

    function handleDragEnd(card) {
      card.classList.remove('card-dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      draggedIndex = null;
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = msg;
      if (type === 'error') {
        toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
      } else {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function filterScripts() {
      renderScripts();
    }

    function setStatusFilter(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.status === status) {
          btn.className = 'filter-btn active bg-slate-800 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-700 transition';
        } else {
          btn.className = 'filter-btn text-slate-400 text-xs font-medium px-3 py-1.5 rounded-lg border border-transparent hover:border-slate-800 transition';
        }
      });
      renderScripts();
    }

    function exportJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scripts, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "scripts.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('Exported updated scripts.json!');
    }

    function extractVideoId(input) {
      if (!input) return null;
      input = input.trim();
      if (input.length === 11) return input;
      const match = input.match(/(?:v=|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    async function fetchYouTubeViews() {
      const apiKey = localStorage.getItem('yt_dashboard_api_key');
      if (!apiKey) {
        openApiKeyModal();
        showToast('Please save your YouTube API Key first', 'error');
        return;
      }

      const idMap = [];
      scripts.forEach((s) => {
        const vid = extractVideoId(s.youtube_video_id);
        if (vid) idMap.push({ scriptId: s.id, videoId: vid });
      });

      if (idMap.length === 0) {
        showToast('No YouTube Video IDs set on scripts', 'error');
        return;
      }

      const btn = document.getElementById('btn-fetch-views');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      const uniqueVideoIds = [...new Set(idMap.map(item => item.videoId))].join(',');

      try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${uniqueVideoIds}&key=${apiKey}`);
        const data = await response.json();

        if (data.error) {
          showToast(`API Error: ${data.error.message}`, 'error');
        } else if (data.items) {
          let updatedCount = 0;
          data.items.forEach(item => {
            const viewCount = parseInt(item.statistics.viewCount, 10);
            idMap.filter(m => m.videoId === item.id).forEach(match => {
              const script = scripts.find(s => s.id === match.scriptId);
              if (script) {
                script.views = viewCount;
                updatedCount++;
              }
            });
          });

          saveState();
          renderScripts();
          showToast(`Updated views for ${updatedCount} video(s)!`);
        }
      } catch (err) {
        console.error("YouTube Fetch Error:", err);
        showToast('Network error fetching YouTube views', 'error');
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }

    function openApiKeyModal() {
      document.getElementById('api-key-input').value = localStorage.getItem('yt_dashboard_api_key') || '';
      document.getElementById('api-modal').classList.remove('hidden');
    }

    function closeApiKeyModal() {
      document.getElementById('api-modal').classList.add('hidden');
    }

    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('yt_dashboard_api_key', val);
      closeApiKeyModal();
      showToast('API Key saved');
    }

    function openEditModal(scriptId) {
      const script = scripts.find(s => s.id === scriptId);
      if (!script) return;

      document.getElementById('modal-title-text').innerText = "Edit Script";
      document.getElementById('edit-id').value = script.id;
      document.getElementById('edit-title').value = script.title || '';
      document.getElementById('edit-category').value = script.category || '';
      document.getElementById('edit-status').value = script.status || 'Draft';
      document.getElementById('edit-youtube-id').value = script.youtube_video_id || '';
      document.getElementById('edit-views').value = script.views || 0;
      document.getElementById('edit-body').value = script.script_body || '';

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function addNewScript() {
      const newId = Date.now();
      document.getElementById('modal-title-text').innerText = "New Script";
      document.getElementById('edit-id').value = newId;
      document.getElementById('edit-title').value = '';
      document.getElementById('edit-category').value = 'Cat H: News & Industry';
      document.getElementById('edit-status').value = 'Draft';
      document.getElementById('edit-youtube-id').value = '';
      document.getElementById('edit-views').value = 0;
      document.getElementById('edit-body').value = '';

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function saveScriptChanges() {
      const id = parseInt(document.getElementById('edit-id').value, 10);
      let script = scripts.find(s => s.id === id);

      if (!script) {
        script = { id: id, sort_order: 1 };
        scripts.forEach(s => s.sort_order++);
        scripts.unshift(script);
      }

      script.title = document.getElementById('edit-title').value;
      script.category = document.getElementById('edit-category').value;
      script.status = document.getElementById('edit-status').value;
      script.youtube_video_id = document.getElementById('edit-youtube-id').value;
      script.views = parseInt(document.getElementById('edit-views').value, 10) || 0;
      script.script_body = document.getElementById('edit-body').value;

      saveState();
      renderScripts();
      closeEditModal();
      showToast('Script saved!');
    }

    function deleteCurrentScript() {
      const id = parseInt(document.getElementById('edit-id').value, 10);
      scripts = scripts.filter(s => s.id !== id);
      saveState();
      renderScripts();
      closeEditModal();
      showToast('Script deleted', 'error');
    }
  </script>
</body>
</html>
